name: cd
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bunx turbo build && bunx turbo test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - run: |
          for app in web api hooks processor worker scheduler; do
            docker buildx build --platform linux/amd64,linux/arm64 -t "${IMAGE_PREFIX}/zap-${app}:${{ github.sha }}" ./apps/${app} --push
          done
      - uses: azure/setup-kubectl@v4
      - run: |
          wget -qO- https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.0/kustomize_v5.4.0_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
      - run: kubectl apply -k infra/k8s/overlays/prod
      - run: kubectl rollout status deployment/api -n zapier --timeout=120s
