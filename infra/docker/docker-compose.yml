version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zapier
      POSTGRES_PASSWORD: zapier
      POSTGRES_DB: zapier
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command: redpanda start --smp 1 --memory 1G --overprovisioned
    ports: ["9092:9092"]
  redis:
    image: redis:7
    command: redis-server --maxmemory-policy noeviction
    ports: ["6379:6379"]
volumes:
  postgres_data:
