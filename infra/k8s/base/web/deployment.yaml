apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: zapier
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/<user>/zap-web:latest
          ports: [{ containerPort: 3000 }]
