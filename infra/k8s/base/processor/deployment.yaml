apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: zapier
spec:
  replicas: 2
  selector:
    matchLabels: { app: processor }
  template:
    metadata:
      labels: { app: processor }
    spec:
      containers:
        - name: processor
          image: ghcr.io/<user>/zap-processor:latest
