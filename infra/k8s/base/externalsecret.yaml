apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zapier-secrets
  namespace: zapier
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: zapier-secrets }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: zapier/prod, property: DATABASE_URL }
    - secretKey: JWT_PASSWORD
      remoteRef: { key: zapier/prod, property: JWT_PASSWORD }
    - secretKey: TOKEN_ENC_KEY
      remoteRef: { key: zapier/prod, property: TOKEN_ENC_KEY }
