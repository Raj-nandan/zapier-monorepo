apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: zapier
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/<user>/zap-api:latest
          ports: [{ containerPort: 3001 }]
