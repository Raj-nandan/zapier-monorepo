apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hooks
  namespace: zapier
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: hooks }
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
