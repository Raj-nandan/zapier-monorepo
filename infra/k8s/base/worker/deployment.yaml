apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: zapier
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/<user>/zap-worker:latest
